[base]
env_name = argus

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 4

[env]
terrain_height = 0.12
terrain_min_size = 0.4
terrain_max_size = 2.0
terrain_num_rects = 80
terrain_platform = 2.0

[policy]
hidden_size = 256
num_layers = 4
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 500_000_000
learning_rate = 0.003
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
use_rnn = 1

[sweep]
method = Protein
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 5e8
mean = 2e8
